<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1326" />
      <stop offset="38%" stop-color="#0F304D" />
      <stop offset="72%" stop-color="#106876" />
      <stop offset="100%" stop-color="#1D9A8C" />
    </linearGradient>
    <radialGradient id="warmGlow" cx="44%" cy="74%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="skyGlow" cx="78%" cy="16%" r="58%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="roofGrad" x1="190" y1="96" x2="400" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="gableGrad" x1="116" y1="164" x2="264" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="sideGrad" x1="264" y1="248" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="amberLit" x1="190" y1="210" x2="190" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="glassRim" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040814" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#warmGlow)" />
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#skyGlow)" />
  

  <g transform="translate(256, 256) scale(0.84) translate(-256, -256)" filter="url(#dropShadow)">
    <!-- 3D Isometric Ground Plinth / Blueprint Axis Lines -->
    <path d="M 88 360.0 L 264 448.0 L 428 366.0" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Extruded Side Wall -->
    <polygon points="264.0,316.0 400.0,248.0 400.0,352.0 264.0,420.0" fill="url(#sideGrad)" />
    <!-- Right Extruded Roof Slope -->
    <polygon points="190.0,164.0 326.0,96.0 400.0,248.0 264.0,316.0" fill="url(#roofGrad)" />
    <!-- Left Gable Roof Overhang Verge -->
    <polygon points="102.0,256.0 190.0,164.0 326.0,96.0 312.0,89.0 176.0,157.0 90.0,247.0" fill="#FFFFFF" />
    <!-- Front Sunlit Gable Wall -->
    <polygon points="116.0,242.0 190.0,164.0 264.0,316.0 264.0,420.0 116.0,346.0" fill="url(#gableGrad)" />

    <!-- Illuminated Double-Height Glazed Gable Cutaway -->
    <polygon points="150.0,264.0 190.0,222.0 230.0,304.0 230.0,378.0 150.0,338.0" fill="url(#amberLit)" />
    <!-- Architectural Mullion Crossbars inside Glazed Gable -->
    <line x1="190" y1="222.0" x2="190" y2="358.0" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round" />
    <line x1="150" y1="300.0" x2="230" y2="340.0" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round" />

    <!-- Illuminated Side Bifold Glazing -->
    <polygon points="294.0,322.0 372.0,283.0 372.0,342.0 294.0,381.0" fill="url(#amberLit)" fill-opacity="0.9" />
    <line x1="333" y1="302.5" x2="333" y2="361.5" stroke="#0F172A" stroke-width="5.5" />

    <!-- Crisp 3D Ridge & Eave Highlights -->
    <polyline points="116,242.0 190,164.0 264,316.0 400,248.0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="190" y1="164.0" x2="326" y2="96.0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
