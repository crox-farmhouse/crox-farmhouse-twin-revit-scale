<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  
  <defs>
    <linearGradient id="bg2" x1="32" y1="16" x2="480" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="42%" stop-color="#1E3A8A"/>
      <stop offset="78%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow2" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barnGlass" x1="244" y1="150" x2="418" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="barnStroke" x1="244" y1="150" x2="418" y2="366" gradientUnits="userSpaceOnUse">
