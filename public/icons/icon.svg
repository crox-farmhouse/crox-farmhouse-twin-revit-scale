      <!-- Wide Carriage Arch Portal (tucks cleanly behind house on left, arches down at x=386 on right) -->
      <path d="M 296 266 C 296 250.536 308.536 238 324 238 H 358 C 373.464 238 386 250.536 386 266 V 364 H 296 V 266 Z"
            fill="#0284C7" fill-opacity="0.22" stroke="#BAE6FD" stroke-opacity="0.58" stroke-width="3.5"/>
    </g>

    <g filter="url(#houseSh)">
      
      <path d="M 136 194
               V 142 C 136 135.373 141.373 130 148 130 H 164 C 170.627 130 176 135.373 176 142 V 156
               L 200 133 C 209.2 124.4 222.8 124.4 232 133
               L 328 224 C 334.4 230 338 238.4 338 247.2
               V 366 C 338 383.673 323.673 398 306 398
               H 126 C 108.327 398 94 383.673 94 366
