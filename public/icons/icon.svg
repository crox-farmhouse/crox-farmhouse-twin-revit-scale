      <rect x="186" y="182" width="60" height="52" rx="10" fill="url(#cutoutBlue)"/>
      <line x1="216" y1="180" x2="216" y2="236" stroke="#F0F9FF" stroke-width="5.5"/>
      <line x1="184" y1="208" x2="248" y2="208" stroke="#F0F9FF" stroke-width="5.5"/>
      <path d="M 186 296 C 186 279.431 199.431 266 216 266 C 232.569 266 246 279.431 246 296 V 398 H 186 V 296 Z"
