<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>

    <!-- Dusk / twilight sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="48%" stop-color="#151c2c" />
      <stop offset="78%" stop-color="#23293a" />
      <stop offset="100%" stop-color="#171920" />
    </linearGradient>

    <!-- Warm golden horizon & window ambient glow -->
    <radialGradient id="warmGlow" cx="54%" cy="62%" r="52%">
      <stop offset="0%" stop-color="#f5c451" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#e59838" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#e59838" stop-opacity="0" />
    </radialGradient>

    <!-- Brass border gradient -->
    <linearGradient id="brassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d478" />
      <stop offset="35%" stop-color="#d4a838" />
      <stop offset="70%" stop-color="#9e761c" />
      <stop offset="100%" stop-color="#e6be5a" />
    </linearGradient>

    <!-- 17th-century Leicestershire red brick -->
    <linearGradient id="brickMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e4332" />
      <stop offset="50%" stop-color="#843526" />
      <stop offset="100%" stop-color="#5d2318" />
    </linearGradient>

    <linearGradient id="brickWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ae4d3b" />
      <stop offset="100%" stop-color="#762d20" />
    </linearGradient>

    <!-- Welsh slate roof -->
    <linearGradient id="slateRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4559" />
      <stop offset="55%" stop-color="#283040" />
      <stop offset="100%" stop-color="#1c222e" />
    </linearGradient>

    <linearGradient id="slateRoofEast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#465269" />
      <stop offset="100%" stop-color="#232a38" />
    </linearGradient>

    <!-- Warm interior KNX window glow -->
    <linearGradient id="winGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4" />
      <stop offset="45%" stop-color="#ffd264" />
      <stop offset="100%" stop-color="#e09224" />
    </linearGradient>

    <!-- Courtyard granite setts ground -->
    <linearGradient id="courtyardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#282b34" />
      <stop offset="45%" stop-color="#1c1f27" />
      <stop offset="100%" stop-color="#101218" />
    </linearGradient>

    <!-- Warm pool reflection on cobblestones -->
    <radialGradient id="cobblePool" cx="58%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ffca57" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#d88b28" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d88b28" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="festoonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="buildingShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#05070c" flood-opacity="0.65" />
    </filter>
  </defs>

  <g clip-path="url(#badgeClip)">
    <!-- Sky & Ambient Backdrop -->
    <rect x="0" y="0" width="512" height="512" fill="url(#skyGrad)" />
    <circle cx="276" cy="296" r="240" fill="url(#warmGlow)" />

    <g transform="">
      <!-- Subtle architectural grid / compass arc in upper sky -->
      <g opacity="0.16" stroke="#e4be64" stroke-width="1.2" fill="none">
        <circle cx="256" cy="285" r="198" stroke-dasharray="4 6" />
        <circle cx="256" cy="285" r="162" />
        <line x1="256" y1="54" x2="256" y2="96" />
        <line x1="72" y1="285" x2="440" y2="285" />
      </g>

      <!-- Subtle evening stars / KNX node constellation -->
      <g fill="#f6dca0" opacity="0.55">
        <circle cx="118" cy="108" r="1.8" />
        <circle cx="168" cy="84" r="1.4" />
        <circle cx="348" cy="92" r="2.0" />
        <circle cx="404" cy="128" r="1.5" />
      </g>

      <!-- Cobbled Courtyard Foreground -->
      <path d="M 0 356 Q 256 342 512 356 L 512 512 L 0 512 Z" fill="url(#courtyardGrad)" />
      <ellipse cx="295" cy="382" rx="195" ry="62" fill="url(#cobblePool)" />

      <!-- Granite sett fan arcs in courtyard -->
      <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.6">
        <path d="M 60 392 Q 256 356 452 392" />
        <path d="M 36 424 Q 256 382 476 424" />
        <path d="M 16 460 Q 256 412 496 460" />
      </g>
      <g fill="none" stroke="#f5c862" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="6 10">
        <path d="M 88 406 Q 268 372 438 406" />
        <path d="M 64 440 Q 268 400 462 440" />
      </g>

      <!-- ================= CROX FARMHOUSE ARCHITECTURE ================= -->
      <g filter="url(#buildingShadow)">
        <!-- Twin 17th-C Brick Chimneys on Main Range -->
        <g>
          <!-- Left Chimney Stack -->
          <rect x="116" y="114" width="26" height="58" rx="2" fill="url(#brickMain)" stroke="#471a11" stroke-width="1.5" />
          <rect x="112" y="110" width="34" height="7" rx="1.5" fill="#b85642" />
          <rect x="117" y="101" width="8" height="10" rx="1.5" fill="#c96b53" />
          <rect x="130" y="101" width="8" height="10" rx="1.5" fill="#c96b53" />

          <!-- Right/Center Chimney Stack -->
          <rect x="242" y="104" width="28" height="62" rx="2" fill="url(#brickMain)" stroke="#471a11" stroke-width="1.5" />
          <rect x="238" y="100" width="36" height="7" rx="1.5" fill="#b85642" />
          <rect x="244" y="90" width="8" height="11" rx="1.5" fill="#c96b53" />
          <rect x="258" y="90" width="8" height="11" rx="1.5" fill="#c96b53" />
        </g>

        <!-- Main Two-Storey Farmhouse Range (Left / Center) -->
        <!-- Welsh Slate Pitched Roof -->
        <polygon points="68,208 106,142 292,142 322,208" fill="url(#slateRoof)" stroke="#4f5d78" stroke-width="2" stroke-linejoin="round" />
        <!-- Slate course lines -->
        <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2">
          <line x1="96" y1="160" x2="299" y2="160" />
          <line x1="86" y1="176" x2="307" y2="176" />
          <line x1="77" y1="192" x2="315" y2="192" />
        </g>
        <!-- Lead ridge flashing -->
        <line x1="105" y1="142" x2="293" y2="142" stroke="#8a99b5" stroke-width="3.5" stroke-linecap="round" />

        <!-- Main Brick Facade -->
        <rect x="78" y="208" width="224" height="150" fill="url(#brickMain)" stroke="#471a11" stroke-width="2" />

        <!-- Central Cross-Gable Porch / Staircase Projection -->
        <polygon points="154,212 194,158 234,212" fill="url(#slateRoofEast)" stroke="#5b6a87" stroke-width="2" stroke-linejoin="round" />
        <rect x="160" y="212" width="68" height="146" fill="url(#brickWing)" stroke="#471a11" stroke-width="1.8" />
        <!-- Stone Quoining / Dentil Eaves Line -->
        <line x1="78" y1="210" x2="302" y2="210" stroke="#d8c3a5" stroke-width="2.5" stroke-opacity="0.55" />

        <!-- Vaulted East Wing Kitchen & Bifolds Extension (Right) -->
        <polygon points="274,244 362,172 446,244" fill="url(#slateRoofEast)" stroke="#687896" stroke-width="2.2" stroke-linejoin="round" />
        <!-- East Wing Brick & Oak Gable Wall -->
        <polygon points="282,358 282,244 362,178 438,244 438,358" fill="url(#brickWing)" stroke="#471a11" stroke-width="2" stroke-linejoin="round" />
        <!-- Exposed Oak A-Frame Gable Beam Trim -->
        <polyline points="282,244 362,178 438,244" fill="none" stroke="#b5834c" stroke-width="5" stroke-linejoin="round" />
        <line x1="286" y1="244" x2="434" y2="244" stroke="#b5834c" stroke-width="4" />

        <!-- Upper Floor Mullioned Casement Windows (Main House) -->
        <g filter="url(#softGlow)">
          <!-- Upper Left Window -->
          <rect x="100" y="226" width="42" height="36" rx="2" fill="url(#winGlow)" stroke="#f4efe6" stroke-width="2.5" />
          <!-- Upper Center Landing Window -->
          <rect x="176" y="222" width="36" height="38" rx="18" fill="url(#winGlow)" stroke="#f4efe6" stroke-width="2.5" />
          <!-- Upper Right Window -->
          <rect x="246" y="226" width="38" height="36" rx="2" fill="url(#winGlow)" stroke="#f4efe6" stroke-width="2.5" />
        </g>
        <!-- Window glazing bars (Upper) -->
        <g stroke="#2a2420" stroke-width="1.8">
          <line x1="121" y1="226" x2="121" y2="262" />
          <line x1="100" y1="244" x2="142" y2="244" />
          <line x1="194" y1="222" x2="194" y2="260" />
          <line x1="176" y1="242" x2="212" y2="242" />
          <line x1="265" y1="226" x2="265" y2="262" />
          <line x1="246" y1="244" x2="284" y2="244" />
        </g>

        <!-- Ground Floor Windows & Entrance Door -->
        <g filter="url(#softGlow)">
          <!-- Sitting Room Bay/Casement Window (Left) -->
          <rect x="96" y="286" width="48" height="46" rx="2" fill="url(#winGlow)" stroke="#f4efe6" stroke-width="2.5" />
          <!-- Panelled Front Entrance Door with Fanlight -->
          <rect x="175" y="284" width="38" height="74" rx="3" fill="#233028" stroke="#d8c3a5" stroke-width="2.5" />
          <rect x="181" y="290" width="26" height="18" rx="1.5" fill="url(#winGlow)" />
          <!-- Dining Room Window -->
          <rect x="244" y="286" width="40" height="46" rx="2" fill="url(#winGlow)" stroke="#f4efe6" stroke-width="2.5" />
        </g>
        <!-- Ground floor window mullions & brass door furniture -->
        <g stroke="#2a2420" stroke-width="1.8">
          <line x1="112" y1="286" x2="112" y2="332" />
          <line x1="128" y1="286" x2="128" y2="332" />
          <line x1="96" y1="309" x2="144" y2="309" />
          <line x1="264" y1="286" x2="264" y2="332" />
          <line x1="244" y1="309" x2="284" y2="309" />
        </g>
        <circle cx="194" cy="326" r="2.6" fill="#f3d478" />

        <!-- East Wing Vaulted Glazing & 5-Leaf Aluminium Bifold Doors -->
        <g filter="url(#softGlow)">
          <!-- Gable Apex Glazed Triangle -->
          <polygon points="310,238 362,194 414,238" fill="url(#winGlow)" opacity="0.92" />
          <!-- Wide 4.5m Bifold Glazing Opening -->
          <rect x="298" y="256" width="124" height="96" rx="3" fill="url(#winGlow)" />
        </g>
        <!-- Anthracite Bifold Mullions & Kitchen Island Silhouette Inside -->
        <rect x="318" y="324" width="84" height="26" rx="2" fill="#1e2a38" opacity="0.72" />
        <!-- 3 Warm Glass Pendants Hanging Over Kitchen Island -->
        <g fill="#fff8dc">
          <circle cx="336" cy="282" r="4.5" />
          <circle cx="360" cy="282" r="4.5" />
          <circle cx="384" cy="282" r="4.5" />
        </g>
        <g stroke="#252830" stroke-width="1.5">
          <line x1="336" y1="256" x2="336" y2="278" />
          <line x1="360" y1="256" x2="360" y2="278" />
          <line x1="384" y1="256" x2="384" y2="278" />
        </g>
        <!-- Anthracite Bifold Frames (5 panels) -->
        <g stroke="#1c2026" stroke-width="3.2" fill="none">
          <rect x="298" y="256" width="124" height="96" rx="2" />
          <line x1="323" y1="256" x2="323" y2="352" />
          <line x1="348" y1="256" x2="348" y2="352" />
          <line x1="372" y1="256" x2="372" y2="352" />
          <line x1="397" y1="256" x2="397" y2="352" />
          <!-- Gable Apex Mullions -->
          <polygon points="310,238 362,194 414,238" />
          <line x1="362" y1="194" x2="362" y2="238" />
        </g>
      </g>

      <!-- Courtyard Catenary Festoon String Lights & Warm Bulbs -->
      <path d="M 78 258 Q 190 292 302 252 Q 375 280 444 252" fill="none" stroke="#1b1e26" stroke-width="2" />
      <g filter="url(#festoonGlow)" fill="#ffe484">
        <circle cx="115" cy="271" r="4.2" />
        <circle cx="156" cy="279" r="4.2" />
        <circle cx="198" cy="281" r="4.2" />
        <circle cx="240" cy="276" r="4.2" />
        <circle cx="278" cy="265" r="4.2" />
        <circle cx="332" cy="266" r="4.2" />
        <circle cx="374" cy="270" r="4.2" />
        <circle cx="414" cy="264" r="4.2" />
      </g>

      <!-- Subtle 3D Isometric Digital Twin Wireframe Plinth Accent at Bottom -->
      <path d="M 64 358 L 448 358" stroke="url(#brassRim)" stroke-width="3" stroke-linecap="round" />
      <path d="M 128 432 L 256 462 L 384 432" fill="none" stroke="url(#brassRim)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
      <circle cx="256" cy="462" r="5" fill="#f3d478" />
      <circle cx="128" cy="432" r="3.5" fill="#d4a838" />
      <circle cx="384" cy="432" r="3.5" fill="#d4a838" />
    </g>

    <!-- Outer Warm-Brass Bevelled Squircle Frame -->
    <rect x="6" y="6" width="500" height="500" rx="106" ry="106" fill="none" stroke="url(#brassRim)" stroke-width="8" opacity="0.9" />
    <rect x="14" y="14" width="484" height="484" rx="98" ry="98" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.14" />
  </g>
</svg>