    <filter id="houseSh" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="8" dy="8" stdDeviation="12" flood-color="#040B1E" flood-opacity="0.40"/>
    </filter>
  </defs>

  
  <clipPath id="outsideHouse">
    <path fill-rule="evenodd" d="M 0 0 H 512 V 512 H 0 Z
          M 136 194 V 142 C 136 135.373 141.373 130 148 130 H 164 C 170.627 130 176 135.373 176 142 V 156
          L 200 133 C 209.2 124.4 222.8 124.4 232 133 L 328 224 C 334.4 230 338 238.4 338 247.2
          V 366 C 338 383.673 323.673 398 306 398 H 126 C 108.327 398 94 383.673 94 366
          V 247.2 C 94 238.4 97.6 230 104 224 L 136 194 Z"/>
  </clipPath>

  
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg2)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow2)"/>

  <g filter="url(#dropSh)">
    
    <g clip-path="url(#outsideHouse)">
      <path d="M 242 242
